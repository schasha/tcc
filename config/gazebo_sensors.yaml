# sensor configuration for the Gazebo + TurtleBot3 burger scenario.
# differences vs. config/sensors.yaml:
#   * IMU topic is /imu (TB3 default) instead of /imu/data
#   * target_frame is odom (TB3 doesn't publish a map by default)
#   * No /temperature topic (TB3 has no thermometer)

defaults:
  target_frame: odom

sensors:

  - topic: /scan
    type: sensor_msgs/msg/LaserScan
    decomposition: array
    array_field: ranges
    unit: meter
    filter:
      kind: finite_within
      min_field: range_min
      max_field: range_max
    expiry_ms: 100

  - topic: /imu
    type: sensor_msgs/msg/Imu
    decomposition: composite
    groups:
      - unit: meter_per_sec_sq
        fields:
          - linear_acceleration.x
          - linear_acceleration.y
          - linear_acceleration.z
      - unit: rad_per_sec
        fields:
          - angular_velocity.x
          - angular_velocity.y
          - angular_velocity.z
    expiry_ms: 10
