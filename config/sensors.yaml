# sensors.yaml — Sensor translation table for the Semantic Gateway
#
# three decomposition patterns cover all sensor_msgs/ types:
#   scalar     — one SmartData per ROS message
#   array      — N SmartData per ROS message, dev = element index
#   composite  — several groups, each with its own unit (e.g. IMU)

defaults:
  target_frame: map

sensors:

  # LaserScan
  # 1 ROS scan → N SmartData (one per beam)
  - topic: /scan
    type: sensor_msgs/msg/LaserScan
    decomposition: array
    array_field: ranges
    unit: meter
    filter:
      kind: finite_within
      min_field: range_min
      max_field: range_max
    expiry_ms: 100

  # IMU
  # 1 ROS Imu → 6 SmartData (3 m·s⁻² + 3 rad·s⁻¹)
  - topic: /imu/data
    type: sensor_msgs/msg/Imu
    decomposition: composite
    groups:
      - unit: meter_per_sec_sq
        fields:
          - linear_acceleration.x
          - linear_acceleration.y
          - linear_acceleration.z
      - unit: rad_per_sec
        fields:
          - angular_velocity.x
          - angular_velocity.y
          - angular_velocity.z
    expiry_ms: 10

  # temperature
  # 1 ROS Temperature → 1 SmartData. Converts °C → K
  - topic: /temperature
    type: sensor_msgs/msg/Temperature
    decomposition: scalar
    value_field: temperature
    value_transform: { kind: linear, a: 1.0, b: 273.15 }
    unit: kelvin
    expiry_ms: 500

  # other example of a sensor
